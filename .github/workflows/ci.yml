name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/runtime.lock.txt
          pip install ruff

      - name: Lint (ruff check)
        run: ruff check agents/ benchmark/ app_evaluation/ web_evaluation/ app_reproduction/ reproduction/ self_explorer/ scripts/ --select E9,F63,F7,F82 --quiet

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_android_platform.py \
            -x -q --timeout=300 \
            --tb=short
        env:
          PYTHONDONTWRITEBYTECODE: 1

  android-platform:
    # Android platform tests that only need POSIX (no emulator).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements/runtime.lock.txt
      - name: Run Android platform tests (non-emulator)
        run: |
          python -m pytest tests/test_android_platform.py \
            -q --timeout=60 --tb=short \
            -k "not inside_guest and not emulator"
