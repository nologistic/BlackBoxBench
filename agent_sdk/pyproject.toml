[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-bench-sdk"
version = "0.1.0"
description = "Pixels-only agent SDK for BlackBoxBench"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["blackbox_bench_sdk*"]
